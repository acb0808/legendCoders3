name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 재현 가능한 설치 보장: 잠금 파일이 없으면 아래 두 잡보다 먼저 실패한다.
  locks:
    name: 의존성 잠금 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML + pydantic
        run: python -m pip install "pydantic>=2.11,<3" "PyYAML>=6.0,<7"
      - name: Check dependency lockfiles
        run: python -m math_variant.tooling.check_locks
        env:
          PYTHONPATH: src

  backend:
    name: 백엔드 품질 게이트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt
          python -m pip install -e . --no-deps
      - name: Lint
        run: ruff check src tests infra
      - name: Format check
        run: ruff format --check src tests infra
      - name: Type check
        run: mypy
      - name: Unit / contract / golden / integration tests
        run: pytest

  frontend:
    name: 프론트엔드 품질 게이트
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Component / integration tests
        run: npm run test

  # 병합 차단 게이트: 위 잡 중 하나라도 실패하면 이 잡이 실패한다.
  quality-gate:
    name: 병합 차단 게이트
    runs-on: ubuntu-latest
    needs: [locks, backend, frontend]
    if: always()
    steps:
      - name: Fail if any quality job failed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "품질 게이트 실패: 병합을 차단한다"
            exit 1
          fi
          echo "모든 품질 게이트 통과"
